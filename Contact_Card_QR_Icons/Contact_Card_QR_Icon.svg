<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<title>Contact Card QR</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2C6FC4"/>
			<stop offset="1" stop-color="#1E5AA8"/>
		</linearGradient>
		<!-- Clips the accent stripe to the card's rounded bottom corners. -->
		<clipPath id="card">
			<rect x="48" y="140" width="416" height="232" rx="26"/>
		</clipPath>
		<!-- Clips the shoulders circle to the round avatar badge. -->
		<clipPath id="avatar">
			<circle cx="146" cy="236" r="60"/>
		</clipPath>
	</defs>
	<!-- App tile -->
	<rect width="512" height="512" rx="104" fill="url(#bg)"/>
	<!-- Hard-edged drop shadow (no blur, so the PNGs can match it exactly) -->
	<rect x="48" y="150" width="416" height="232" rx="26" fill="#000" fill-opacity="0.25"/>
	<!-- The business card -->
	<rect x="48" y="140" width="416" height="232" rx="26" fill="#FFFFFF"/>
	<rect x="48" y="336" width="416" height="36" fill="#F2A33A" clip-path="url(#card)"/>
	<!-- Avatar -->
	<circle cx="146" cy="236" r="60" fill="#DCE8F7"/>
	<circle cx="146" cy="218" r="24" fill="#1E5AA8"/>
	<circle cx="146" cy="300" r="50" fill="#1E5AA8" clip-path="url(#avatar)"/>
	<!-- Name and detail lines -->
	<rect x="232" y="198" width="192" height="26" rx="13" fill="#2B3A4A"/>
	<rect x="232" y="244" width="192" height="16" rx="8" fill="#A3B1C2"/>
	<rect x="232" y="276" width="148" height="16" rx="8" fill="#A3B1C2"/>
</svg>
